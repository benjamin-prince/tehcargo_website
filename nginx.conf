server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The site is one page; anything else lands on it rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers d'assets doivent repondre 404 s'ils manquent, et non
    # retomber sur index.html : le repli du logo depend d'une vraie erreur.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    server_tokens off;
}
